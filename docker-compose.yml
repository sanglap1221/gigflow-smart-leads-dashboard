version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: gigflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gigflow-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/gigflow
      - JWT_SECRET=supersecretjwtkey_change_me_in_production
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gigflow-client
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo-data:
